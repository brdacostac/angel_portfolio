<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#241018"/>
      <stop offset="100%" stop-color="#0F0608"/>
    </linearGradient>
    <linearGradient id="ak" x1="2" y1="0" x2="30" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8688A"/>
      <stop offset="100%" stop-color="#D4A070"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>

  <!-- AK monogram — italic serif to match Bodoni Moda -->
  <text
    x="16" y="21.5"
    text-anchor="middle"
    font-family="Georgia, 'Didot', 'Times New Roman', serif"
    font-size="15.5"
    font-weight="700"
    font-style="italic"
    fill="url(#ak)"
    letter-spacing="0.5"
  >AK</text>
</svg>
